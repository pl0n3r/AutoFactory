name: Sonar check details

on:
  pull_request:
    paths:
      - .github/workflows/sonar-check-details.yml
      - scripts/sonar-check-relay.cjs
      - test-sonar-check-relay.cjs
  push:
    branches: [main]
  check_run:
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sonar-details-${{ github.event_name }}-${{ github.event.check_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - run: node test-sonar-check-relay.cjs

  report:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug == 'sonarqubecloud' &&
       github.event.check_run.name == 'SonarCloud Code Analysis')
    permissions:
      contents: read
      checks: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main, never PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Publish exact-head Sonar check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sonar-check-relay.cjs
