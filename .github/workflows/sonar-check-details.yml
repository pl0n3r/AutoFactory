name: Sonar check details

on:
  pull_request:
    paths:
      - .github/workflows/sonar-check-details.yml
      - scripts/sonar-check-relay.cjs
      - test-sonar-check-relay.cjs
  push:
    branches: [main]
  check_run:
    types: [completed]

permissions:
  contents: read

concurrency:
  group: sonar-details-${{ github.event_name }}-${{ github.event.check_run.id || github.ref }}
  cancel-in-progress: false

jobs:
  test:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - run: node test-sonar-check-relay.cjs
      - name: Diagnostic authenticated Sonar reliability issues on main
        if: github.event_name == 'pull_request'
        shell: bash
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const token = process.env.SONAR_TOKEN || '';
          console.log(`SONAR_TOKEN_PRESENT=${Boolean(token)}`);
          if (!token) process.exit(0);
          const params = new URLSearchParams({
            componentKeys: 'pl0n3r_AutoFactory',
            branch: 'main',
            issueStatuses: 'OPEN,CONFIRMED',
            ps: '500'
          });
          const response = await fetch(`https://sonarcloud.io/api/issues/search?${params}`, {
            headers: { Authorization: `Bearer ${token}` }
          });
          if (!response.ok) throw new Error(`Sonar API ${response.status}`);
          const payload = await response.json();
          const issues = payload.issues || [];
          const reliability = issues.filter(issue =>
            (issue.impacts || []).some(impact => impact.softwareQuality === 'RELIABILITY')
          );
          console.log(`SONAR_ISSUE_TOTAL=${payload.total ?? payload.paging?.total ?? issues.length}`);
          console.log(`SONAR_RELIABILITY_TOTAL=${reliability.length}`);
          for (const issue of reliability) {
            console.log(JSON.stringify({
              key: issue.key,
              rule: issue.rule,
              type: issue.type,
              severity: issue.severity,
              status: issue.status,
              component: issue.component,
              line: issue.line,
              message: issue.message,
              cleanCodeAttribute: issue.cleanCodeAttribute,
              impacts: issue.impacts,
              creationDate: issue.creationDate
            }));
          }
          NODE
      - name: Diagnostic offline SonarJS problem rules
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          work=/tmp/autofactory-sonarjs
          rm -rf "$work"
          mkdir -p "$work/input"
          cp autopilot-core.js content.js "$work/input/"
          cd "$work"
          npm init -y >/dev/null 2>&1
          npm install --ignore-scripts --no-audit --no-fund --save-dev eslint@9 eslint-plugin-sonarjs >/dev/null 2>&1
          node <<'NODE'
          const { ESLint } = await import('eslint');
          const sonarjsModule = await import('eslint-plugin-sonarjs');
          const sonarjs = sonarjsModule.default ?? sonarjsModule;
          const recommended = sonarjs.configs?.recommended;
          if (!recommended) throw new Error('eslint-plugin-sonarjs recommended config unavailable');
          const eslint = new ESLint({
            overrideConfigFile: true,
            overrideConfig: [recommended]
          });
          const results = await eslint.lintFiles(['input/autopilot-core.js', 'input/content.js']);
          let count = 0;
          for (const result of results) {
            for (const message of result.messages) {
              if (!message.ruleId?.startsWith('sonarjs/')) continue;
              const ruleName = message.ruleId.slice('sonarjs/'.length);
              const meta = sonarjs.rules?.[ruleName]?.meta;
              if (meta?.type !== 'problem') continue;
              count += 1;
              console.log(JSON.stringify({
                file: result.filePath.split('/').pop(),
                line: message.line,
                column: message.column,
                rule: message.ruleId,
                message: message.message,
                type: meta.type
              }));
            }
          }
          console.log(`SONARJS_PROBLEM_TOTAL=${count}`);
          NODE

  report:
    if: >-
      github.event_name == 'push' ||
      (github.event_name == 'check_run' &&
       github.event.check_run.app.slug == 'sonarqubecloud' &&
       github.event.check_run.name == 'SonarCloud Code Analysis')
    permissions:
      contents: read
      checks: read
      pull-requests: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout trusted main, never PR code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
      - name: Publish exact-head Sonar check annotations
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/sonar-check-relay.cjs
