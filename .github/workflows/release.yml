name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - name: Verify exact tag and Chrome/Safari/package/lock versions
        run: node scripts/verify-release-metadata.cjs "$GITHUB_REF_NAME"
      - name: Verify tagged commit is current main
        run: |
          set -euo pipefail
          git show-ref --verify --quiet refs/remotes/origin/main
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/main)"

  chrome_smoke:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - name: Real Chrome ephemeral extension-load smoke
        run: node scripts/chrome-ephemeral-smoke.cjs "$GITHUB_REF_NAME" "$GITHUB_SHA"

  safari_smoke:
    needs: preflight
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          package-manager-cache: false
      - name: Real unsigned Safari/Xcode build smoke
        run: bash scripts/safari-unsigned-build-smoke.sh "$GITHUB_REF_NAME" "$GITHUB_SHA"

  publish:
    needs: [preflight, chrome_smoke, safari_smoke]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Recheck current main immediately before packaging
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(gh api "repos/$GITHUB_REPOSITORY/branches/main" --jq '.commit.sha')"
      - name: Package Chrome and Safari
        run: python3 scripts/package-release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes --title "ChatGPT Autopilot Local $GITHUB_REF_NAME"
