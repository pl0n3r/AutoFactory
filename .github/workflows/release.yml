name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify tag matches manifest
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./manifest.json').version")"
      - name: Package Chrome and Safari
        run: python3 scripts/package-release.py
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --verify-tag --generate-notes --title "ChatGPT Autopilot Local $GITHUB_REF_NAME"
