name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Validate / Pruebas y smoke Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_validate_required_check.py' -v
      - name: Ejecutar aceptación #258 y regresiones CI #267
        run: |
          set -euo pipefail
          if [ -f docs/lista-salida-produccion.md ] || [ -f tests/test_lista_salida_produccion.py ]; then
            test -f docs/lista-salida-produccion.md
            test -f tests/test_lista_salida_produccion.py
            python3 -m unittest -v tests.test_lista_salida_produccion
          fi
          python3 -m unittest -v tests.test_ci_salida_quality
      - name: Exigir checkout del HEAD exacto del autor para aceptación #240
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}" || {
            echo "::error::La aceptación no está en HEAD exacto"
            exit 1
          }
      - name: Verificar aceptación del inventario #240 cuando esté presente
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}" || {
            echo "::error::La aceptación #240 no está en HEAD exacto"
            exit 1
          }
          if [ -f docs/reconciliacion-issues-20261024.md ] || [ -f tests/test_reconciliacion_issues_20261024.py ]; then
            if [ ! -f docs/reconciliacion-issues-20261024.md ] || [ ! -f tests/test_reconciliacion_issues_20261024.py ]; then
              echo "::error::Inventario #240 incompleto: faltan el informe o su test"
              exit 1
            fi
            python3 -m unittest -v tests.test_reconciliacion_issues_20261024.ReconciliacionIssuesTests.test_acceptance
          fi
      - name: Verificar aceptación offline SIN_AVANCE #246 cuando esté en el HEAD
        run: |
          if [ -f local-tab-progress.js ] || [ -f test-local-tab-progress.cjs ] || [ -f tests/test_local_tab_progress.py ]; then
            test -f local-tab-progress.js && test -f test-local-tab-progress.cjs && test -f tests/test_local_tab_progress.py || {
              echo "::error::Contrato local #246 incompleto en HEAD"
              exit 1
            }
            node test-local-tab-progress.cjs
            python3 -m unittest -v tests.test_local_tab_progress.LocalTabProgressTests.test_no_progress_requires_threshold_and_stable_fingerprint tests.test_local_tab_progress.LocalTabProgressTests.test_fresh_activity_resets_state_and_excludes_chat_payload
          fi
      - name: Ejecutar aceptación offline #260 y #265 en checkout exacto
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"
          if [ -f docs/local-recovery.md ] || [ -f tests/test_local_recovery_contract.py ]; then
            test -f docs/local-recovery.md
            test -f tests/test_local_recovery_contract.py
            python3 -m unittest -v tests.test_local_recovery_contract
          fi
          if [ -f docs/permisos-extension-auditoria.md ] || [ -f tests/test_permisos_extension_auditoria.py ]; then
            test -f docs/permisos-extension-auditoria.md
            test -f tests/test_permisos_extension_auditoria.py
            python3 -m unittest -v tests.test_permisos_extension_auditoria
          fi
      - name: Obtener merge sintético de PR para autocontrol de CI
        if: github.event_name == 'pull_request'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: .ci-merge-acceptance
      - name: Autocontrol de wiring de aceptación (merge PR o push)
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            test -f .ci-merge-acceptance/tests/test_ci_pending_acceptance.py
            (cd .ci-merge-acceptance && python3 -m unittest -v tests.test_ci_pending_acceptance)
          else
            python3 -m unittest -v tests.test_ci_pending_acceptance
          fi
      - name: Real Chrome MV3 extension-load smoke (non-release checkout)
        run: node scripts/chrome-ephemeral-smoke.cjs "v$(node -p 'require("./manifest.json").version')" "$(git rev-parse HEAD)"
      - name: Verificar presentación local SIN AVANCE (AC-01/02/04)
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}" || {
            echo "::error::AC-03 #250 debe validarse sobre HEAD exacto"
            exit 1
          }
          python3 -m unittest -v \
            tests.test_local_progress_presentation.LocalProgressPresentationTests.test_offline_state_labels_without_chat_payload \
            tests.test_local_progress_presentation.LocalProgressPresentationTests.test_unknown_and_disabled_without_runtime_or_network \
            tests.test_local_progress_presentation.LocalProgressPresentationTests.test_popup_source_mirrors_safari
      - run: node test-workflow-hardening.cjs
      - run: node test-release-evidence.cjs
