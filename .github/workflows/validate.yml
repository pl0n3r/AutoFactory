name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    name: Validate / Pruebas y smoke Chrome
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 20
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: python3 -m unittest discover -s tests -p 'test_validate_required_check.py' -v
      - name: Verificar aceptación del inventario #240 cuando esté presente
        run: |
          if [ -f docs/reconciliacion-issues-20261024.md ] || [ -f tests/test_reconciliacion_issues_20261024.py ]; then
            if [ ! -f docs/reconciliacion-issues-20261024.md ] || [ ! -f tests/test_reconciliacion_issues_20261024.py ]; then
              echo "::error::Inventario #240 incompleto: faltan el informe o su test"
              exit 1
            fi
            python3 -m unittest -v tests.test_reconciliacion_issues_20261024.ReconciliacionIssuesTests.test_acceptance
          fi
      - name: Real Chrome MV3 extension-load smoke (non-release checkout)
        run: node scripts/chrome-ephemeral-smoke.cjs "v$(node -p 'require("./manifest.json").version')" "$(git rev-parse HEAD)"
      - run: node test-workflow-hardening.cjs
      - run: node test-release-evidence.cjs
